repo_path: .
output_dir: ./pyragify-output

max_words: 200000
max_file_size: 10485760

skip_patterns:
  - "*.db"
  - "*.o"
  - "*.out"
  - "*.s"
  - "*.test"
  - "pyragify-output/"

skip_dirs:
  - .git
  - .agents
  - .cache
  - __pycache__
  - bin
  - node_modules
  - pyragify-output

verbose: false
